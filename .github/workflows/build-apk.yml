name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      run_unit_tests:
        description: "Run non-emulator unit & Robolectric tests before building APK"
        required: false
        default: true
        type: boolean

jobs:
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' && secrets.STORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -x "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "${GOOGLE_SERVICES_JSON:-}" ]; then
            TRIMMED="$(printf '%s' "${GOOGLE_SERVICES_JSON}" | sed -e 's/^[[:space:]]*//')"
            case "${TRIMMED}" in
              \{*)
                printf '%s' "${GOOGLE_SERVICES_JSON}" > app/google-services.json
                ;;
              *)
                printf '%s' "${GOOGLE_SERVICES_JSON}" | base64 -d > app/google-services.json
                ;;
            esac
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json is missing. Add GOOGLE_SERVICES_JSON to GitHub repository Secrets (or include app/google-services.json) for Firebase Auth, Firestore, and Gemini AI to work in the built APK."
          fi

      - name: Run Unit & Robolectric Tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_unit_tests }}
        run: |
          gradle :app:testDebugUnitTest \
            --tests "com.example.ExampleUnitTest" \
            --tests "com.example.ExampleRobolectricTest" \
            --tests "com.example.service.AiOrganizerServiceTest" \
            --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceledger-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Build Signed Release APK (when release signing secrets are set)
        if: env.HAS_RELEASE_SIGNING == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 -d > "${KEYSTORE_PATH}"
          gradle :app:assembleRelease --no-daemon

      - name: Upload Release APK artifact
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: voiceledger-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
